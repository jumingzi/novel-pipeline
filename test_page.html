<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说矩阵工坊</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

  <!-- ========== HAMBURGER ========== -->
  <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">
    <span></span>
  </button>

  <!-- ========== SIDEBAR OVERLAY ========== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">

    <!-- Project List -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">项目列表</div>
      <ul class="project-list" id="projectList">
        <li class="project-item active" data-project="doupotongren">
          <span class="project-dot"></span> 斗破同人
        </li>
        <li class="project-item" data-project="fanrentongren">
          <span class="project-dot"></span> 凡人同人
        </li>
        <li class="project-item" data-project="yuanchuangxianxia">
          <span class="project-dot"></span> 原创仙侠
        </li>
      </ul>
      <button class="btn-new-project" id="btnNewProject">+ 新建项目</button>
    </div>

    <!-- Settings -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">项目设置</div>

      <div class="setting-row">
        <label class="setting-label" for="genreSelect">题材</label>
        <select class="setting-select" id="genreSelect">
          <option value="玄幻" selected>玄幻</option>
          <option value="仙侠">仙侠</option>
          <option value="武侠">武侠</option>
          <option value="都市">都市</option>
          <option value="轻小说">轻小说</option>
          <option value="历史">历史</option>
          <option value="军事">军事</option>
          <option value="科幻">科幻</option>
          <option value="奇幻">奇幻</option>
          <option value="游戏">游戏</option>
          <option value="悬疑">悬疑</option>
          <option value="现实">现实</option>
          <option value="体育">体育</option>
          <option value="短篇">短篇</option>
        </select>
      </div>

      <div class="setting-row">
        <label class="setting-label" for="refBook">对标书</label>
        <input class="setting-input" type="text" id="refBook" placeholder="例如: 凡人修仙传">
      </div>

      <div class="setting-row">
        <label class="setting-label">字数目标</label>
        <div class="slider-row">
          <input class="setting-slider" type="range" id="wordCountSlider" min="2000" max="8000" value="3000" step="500">
          <span class="slider-value" id="wordCountValue">3000</span>
        </div>
      </div>

      <div class="setting-row">
        <div class="toggle-row">
          <label class="setting-label" style="margin-bottom:0;">联网搜索</label>
          <label class="toggle">
            <input type="checkbox" id="webSearchToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Source File Upload -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">上传源文件</div>
      <div class="drop-zone" id="dropZoneSource">
        <span>拖拽 .txt / .epub / .mobi 到此处</span>
        <br><span style="font-size:11px;">或点击选择文件</span>
        <div class="drop-zone-file" id="dropZoneSourceFile"></div>
      </div>
      <input type="file" id="fileInputSource" accept=".txt,.epub,.mobi" style="display:none;">

      <!-- Reference Book Upload -->
      <div class="sidebar-section-title" style="margin-top:6px;">上传参考书</div>
      <div class="drop-zone" id="dropZoneRef">
        <span>拖拽对标书 .txt / .epub / .mobi 到此处</span>
        <br><span style="font-size:11px;">或点击选择文件</span>
        <div class="drop-zone-file" id="dropZoneRefFile"></div>
      </div>
      <input type="file" id="fileInputRef" accept=".txt,.epub,.mobi" style="display:none;">

      <button class="btn-sidebar-action" id="btnAnalyze">开始拆书</button>
      <button class="btn-sidebar-action" id="btnGenerateChapter" style="margin-top:6px;">生成章节</button>
    </div>

  </aside>

  <!-- ========== MAIN AREA ========== -->
  <main class="main">

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-dot-wrap">
        <div class="progress-dot" id="dot1" data-agent="agent1"></div>
        <span class="progress-label">清洗分章</span>
      </div>
      <div class="progress-line"></div>
      <div class="progress-dot-wrap">
        <div class="progress-dot" id="dot2" data-agent="agent2"></div>
        <span class="progress-label">拆解分析</span>
      </div>
      <div class="progress-line"></div>
      <div class="progress-dot-wrap">
        <div class="progress-dot" id="dot3" data-agent="agent3"></div>
        <span class="progress-label">知识入库</span>
      </div>
      <div class="progress-line"></div>
      <div class="progress-dot-wrap">
        <div class="progress-dot" id="dot4" data-agent="agent4"></div>
        <span class="progress-label">章节生成</span>
      </div>
    </div>

    <!-- Message List -->
    <div class="message-list" id="messageList">
      <div class="message-list-empty" id="messageListEmpty">
        输入大纲或情节，开始创作
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-row">
        <textarea class="input-box" id="inputBox" placeholder="输入章节大纲、情节构思，或卡文时的困惑..." rows="1"></textarea>
        <button class="btn-send" id="btnSend">寄</button>
      </div>
    </div>

  </main>

</div>

<!-- ========== KB PANEL ========== -->
<div class="kb-panel" id="kbPanel">
  <div class="kb-panel-header" id="kbPanelHeader">
    <span>知识库</span>
    <span class="arrow">&#9660;</span>
  </div>
  <div class="kb-panel-body">
    <div class="kb-stat">
      <span class="kb-stat-label">人物数量</span>
      <span class="kb-stat-value" id="kbCharCount">0</span>
    </div>
    <div class="kb-stat">
      <span class="kb-stat-label">伏笔数量</span>
      <span class="kb-stat-value" id="kbForeshadowCount">0</span>
    </div>
    <div class="kb-chapter-list" id="kbChapterList">
      <div style="color:var(--ink-light);font-size:11px;">暂无已采纳章节</div>
    </div>
  </div>
</div>

<!-- KB Toggle Button -->
<button class="kb-toggle" id="kbToggle" aria-label="Toggle knowledge base">&#9679;</button>

<!-- ========== INSPIRATION MODAL ========== -->
<div class="modal-backdrop" id="inspirationModal">
  <div class="modal">
    <div class="modal-title">灵感启发</div>
    <div class="modal-body" id="inspirationBody"></div>
    <button class="modal-close" id="inspirationClose">关闭</button>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div class="toast" id="toast"></div>

<!-- ==========================================================
     SCRIPTS
     ========================================================== -->
<script>
(function() {
  'use strict';

  /* ---- DOM Refs ---- */
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const sidebar         = $('#sidebar');
  const hamburger       = $('#hamburger');
  const sidebarOverlay  = $('#sidebarOverlay');
  const messageList     = $('#messageList');
  const messageListEmpty= $('#messageListEmpty');
  const inputBox        = $('#inputBox');
  const btnSend         = $('#btnSend');
  const btnAnalyze      = $('#btnAnalyze');
  const btnGenerateCh   = $('#btnGenerateChapter');
  const kbPanel         = $('#kbPanel');
  const kbToggle        = $('#kbToggle');
  const kbPanelHeader   = $('#kbPanelHeader');
  const kbCharCount     = $('#kbCharCount');
  const kbForeshadowCount = $('#kbForeshadowCount');
  const kbChapterList   = $('#kbChapterList');
  const inspirationModal= $('#inspirationModal');
  const inspirationBody = $('#inspirationBody');
  const inspirationClose= $('#inspirationClose');
  const toast           = $('#toast');
  const genreSelect     = $('#genreSelect');
  const wordCountSlider = $('#wordCountSlider');
  const wordCountValue  = $('#wordCountValue');
  const webSearchToggle = $('#webSearchToggle');
  const dropZoneSource  = $('#dropZoneSource');
  const dropZoneRef     = $('#dropZoneRef');
  const fileInputSource = $('#fileInputSource');
  const fileInputRef    = $('#fileInputRef');
  const dropZoneSourceFile = $('#dropZoneSourceFile');
  const dropZoneRefFile = $('#dropZoneRefFile');

  /* ---- State ---- */
  let currentProject = 'doupotongren';
  let uploadedFilePath = '';
  let uploadedRefPaths = [];
  let savedChapters = [];
  let eventSource = null;

  /* ---- Helpers ---- */
  function showToast(msg, duration) {
    duration = duration || 2000;
    clearTimeout(showToast._timer);
    toast.textContent = msg;
    toast.classList.add('show');
    showToast._timer = setTimeout(function() {
      toast.classList.remove('show');
    }, duration);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /* ---- Sidebar Toggle ---- */
  function openSidebar() {
    sidebar.classList.remove('collapsed');
    sidebarOverlay.classList.add('active');
  }

  function closeSidebar() {
    sidebar.classList.add('collapsed');
    sidebarOverlay.classList.remove('active');
  }

  hamburger.addEventListener('click', function() {
    if (sidebar.classList.contains('collapsed')) {
      openSidebar();
    } else {
      closeSidebar();
    }
  });

  sidebarOverlay.addEventListener('click', closeSidebar);

  /* ---- Project Selection ---- */
  $('#projectList').addEventListener('click', function(e) {
    var item = e.target.closest('.project-item');
    if (!item) return;
    $$('.project-item').forEach(function(el) { el.classList.remove('active'); });
    item.classList.add('active');
    currentProject = item.dataset.project;
    closeSidebar();
  });

  /* ---- New Project ---- */
  $('#btnNewProject').addEventListener('click', function() {
    var name = prompt('请输入新项目名称：');
    if (!name) return;
    var li = document.createElement('li');
    li.className = 'project-item';
    li.dataset.project = 'proj_' + Date.now();
    li.innerHTML = '<span class="project-dot"></span> ' + escapeHtml(name);
    $('#projectList').appendChild(li);
    li.addEventListener('click', function(e) {
      $$('.project-item').forEach(function(el) { el.classList.remove('active'); });
      li.classList.add('active');
      currentProject = li.dataset.project;
    });
  });

  /* ---- Word Count Slider ---- */
  wordCountSlider.addEventListener('input', function() {
    wordCountValue.textContent = this.value;
  });

  /* ---- File Upload: Source ---- */
  dropZoneSource.addEventListener('click', function() { fileInputSource.click(); });
  dropZoneSource.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
  dropZoneSource.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
  dropZoneSource.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    var file = e.dataTransfer.files[0];
    if (file) uploadFile(file, 'source');
  });
  fileInputSource.addEventListener('change', function() {
    if (this.files[0]) uploadFile(this.files[0], 'source');
  });

  /* ---- File Upload: Reference ---- */
  dropZoneRef.addEventListener('click', function() { fileInputRef.click(); });
  dropZoneRef.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
  dropZoneRef.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
  dropZoneRef.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    var file = e.dataTransfer.files[0];
    if (file) uploadFile(file, 'ref');
  });
  fileInputRef.addEventListener('change', function() {
    if (this.files[0]) uploadFile(this.files[0], 'ref');
  });

  function uploadFile(file, type) {
    var formData = new FormData();
    formData.append('file', file);
    var endpoint = type === 'source' ? '/api/upload' : '/api/upload-reference';

    fetch(endpoint, { method: 'POST', body: formData })
      .then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
        return r.json();
      })
      .then(function(data) {
        if (type === 'source') {
          uploadedFilePath = data.path;
          dropZoneSourceFile.textContent = data.filename + ' (' + formatSize(data.size) + ')';
          dropZoneSourceFile.style.display = 'block';
          showToast('源文件上传成功: ' + data.filename);
        } else {
          uploadedRefPaths.push(data.path);
          dropZoneRefFile.textContent = data.filename + ' (' + formatSize(data.size) + ')';
          dropZoneRefFile.style.display = 'block';
          showToast('参考书上传成功: ' + data.filename);
        }
      })
      .catch(function(err) {
        showToast('上传失败: ' + err.message, 3000);
      });
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  /* ---- Progress Dots ---- */
  function updateProgressDot(agentId, status) {
    var map = { agent1: 'dot1', agent2: 'dot2', agent3: 'dot3', agent4: 'dot4' };
    var dot = $('#' + map[agentId]);
    if (!dot) return;
    dot.classList.remove('done', 'running', 'error');
    if (status === 'done') dot.classList.add('done');
    else if (status === 'running') dot.classList.add('running');
  }

  function resetAllDots() {
    ['dot1','dot2','dot3','dot4'].forEach(function(id) {
      var dot = $('#' + id);
      if (dot) dot.classList.remove('done', 'running', 'error');
    });
  }

  /* ---- Messages ---- */
  function addMessage(role, text) {
    messageListEmpty.style.display = 'none';
    var msg = document.createElement('div');
    msg.className = 'message message-' + role;

    var meta = document.createElement('div');
    meta.className = 'bubble-meta';
    meta.innerHTML = '<span class="bubble-meta-icon">' + (role === 'ai' ? '&#x6C34;' : '&#x2318;') + '</span> ' +
                     (role === 'ai' ? 'AI写手' : '你');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(meta);
    msg.appendChild(bubble);

    if (role === 'ai' && text.trim()) {
      var actions = document.createElement('div');
      actions.className = 'bubble-actions';

      var btnAccept = document.createElement('button');
      btnAccept.className = 'btn-action';
      btnAccept.textContent = '采纳';
      btnAccept.addEventListener('click', function() {
        savedChapters.push({ text: text, time: new Date().toLocaleString() });
        renderKBChapters();
        btnAccept.classList.add('accepted');
        btnAccept.textContent = '已采纳';
        showToast('章节已保存至知识库');
      });

      var btnTweak = document.createElement('button');
      btnTweak.className = 'btn-action';
      btnTweak.textContent = '微调';
      btnTweak.addEventListener('click', function() {
        inputBox.value = '请微调以下内容，保持风格一致：\n\n' + text.substring(0, 200) + '...';
        inputBox.focus();
        showToast('微调指令已填入输入框');
      });

      var btnRewrite = document.createElement('button');
      btnRewrite.className = 'btn-action';
      btnRewrite.textContent = '重写';
      btnRewrite.addEventListener('click', function() {
        generateChapter(inputBox.value || text.substring(0, 100) + '...');
      });

      actions.appendChild(btnAccept);
      actions.appendChild(btnTweak);
      actions.appendChild(btnRewrite);
      msg.appendChild(actions);
    }

    messageList.appendChild(msg);
    messageList.scrollTop = messageList.scrollHeight;
    return msg;
  }

  function addTypingIndicator() {
    messageListEmpty.style.display = 'none';
    var indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span></span><span></span><span></span>';
    indicator.id = 'typingIndicator';
    messageList.appendChild(indicator);
    messageList.scrollTop = messageList.scrollHeight;
  }

  function removeTypingIndicator() {
    var el = $('#typingIndicator');
    if (el) el.remove();
  }

  /* ---- KB Panel ---- */
  function renderKBChapters() {
    kbChapterList.innerHTML = '';
    if (savedChapters.length === 0) {
      kbChapterList.innerHTML = '<div style="color:var(--ink-light);font-size:11px;">暂无已采纳章节</div>';
      return;
    }
    savedChapters.forEach(function(ch, i) {
      var div = document.createElement('div');
      div.className = 'kb-chapter-item';
      div.textContent = '章节 ' + (i + 1) + ' (' + ch.time + ')';
      div.addEventListener('click', function() {
        addMessage('ai', ch.text);
      });
      kbChapterList.appendChild(div);
    });
  }

  function toggleKBPanel() {
    kbPanel.classList.toggle('collapsed');
  }

  kbToggle.addEventListener('click', toggleKBPanel);
  kbPanelHeader.addEventListener('click', toggleKBPanel);

  /* ---- Inspiration Modal ---- */
  function showInspiration(text) {
    inspirationBody.textContent = text;
    inspirationModal.classList.add('active');
  }

  inspirationClose.addEventListener('click', function() {
    inspirationModal.classList.remove('active');
  });

  inspirationModal.addEventListener('click', function(e) {
    if (e.target === inspirationModal) inspirationModal.classList.remove('active');
  });

  /* ---- API Calls ---- */
  function postForm(url, data) {
    var formData = new FormData();
    for (var key in data) {
      if (data.hasOwnProperty(key)) {
        formData.append(key, data[key]);
      }
    }
    return fetch(url, { method: 'POST', body: formData });
  }

  function startAnalysis() {
    if (!uploadedFilePath) {
      showToast('请先上传源文件', 3000);
      return;
    }
    var genre = genreSelect.value;
    var refPathStr = uploadedRefPaths.length > 0 ? JSON.stringify(uploadedRefPaths) : '';
    btnAnalyze.disabled = true;
    btnAnalyze.textContent = '分析中...';
    resetAllDots();

    postForm('/api/analyze', {
      file_path: uploadedFilePath,
      genre: genre,
      reference_paths: refPathStr
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        showToast('分析已启动');
      })
      .catch(function(err) {
        showToast('启动分析失败: ' + err.message, 3000);
        btnAnalyze.disabled = false;
        btnAnalyze.textContent = '开始拆书';
      });
  }

  function generateChapter(outline) {
    if (!outline || !outline.trim()) {
      showToast('请输入章节大纲或情节', 3000);
      return;
    }
    var genre = genreSelect.value;
    var wordCount = parseInt(wordCountSlider.value, 10);
    var refStyle = $('#refBook').value.trim();

    addTypingIndicator();
    btnGenerateCh.disabled = true;

    postForm('/api/generate-chapter', {
      outline: outline.trim(),
      genre: genre,
      word_count: wordCount,
      reference_style: refStyle
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        removeTypingIndicator();
        btnGenerateCh.disabled = false;
        showToast('章节生成已启动，请等待进度更新');
      })
      .catch(function(err) {
        removeTypingIndicator();
        btnGenerateCh.disabled = false;
        showToast('生成失败: ' + err.message, 3000);
      });
  }

  function handleSend() {
    var text = inputBox.value.trim();
    if (!text) return;

    // Detect inspiration request
    if (text.startsWith('/灵感') || text.includes('卡文') || text.includes('没思路') || text.includes('写不下去')) {
      addMessage('user', text);
      inputBox.value = '';
      addTypingIndicator();
      postForm('/api/inspiration', { stuck_point: text })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          removeTypingIndicator();
          if (data.suggestion) {
            showInspiration(data.suggestion);
          }
        })
        .catch(function(err) {
          removeTypingIndicator();
          showToast('获取灵感失败: ' + err.message, 3000);
        });
      return;
    }

    // Title generation
    if (text.startsWith('/书名') || text.startsWith('/标题')) {
      var synopsis = text.replace(/^\/[书标][名题]/, '').trim();
      if (!synopsis) {
        showToast('请提供故事简介，例如: /书名 一个少年在修真界崛起的故事', 3000);
        return;
      }
      addMessage('user', text);
      inputBox.value = '';
      addTypingIndicator();
      postForm('/api/titles', { synopsis: synopsis, genre: genreSelect.value })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          removeTypingIndicator();
          if (data.titles) {
            addMessage('ai', data.titles);
          }
        })
        .catch(function(err) {
          removeTypingIndicator();
          showToast('生成标题失败: ' + err.message, 3000);
        });
      return;
    }

    // Regular chapter generation
    addMessage('user', text);
    inputBox.value = '';
    inputBox.style.height = 'auto';
    generateChapter(text);
  }

  btnSend.addEventListener('click', handleSend);

  inputBox.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  // Auto-resize textarea
  inputBox.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  /* ---- Analysis & Generate Buttons ---- */
  btnAnalyze.addEventListener('click', startAnalysis);

  btnGenerateCh.addEventListener('click', function() {
    var outline = inputBox.value.trim();
    if (!outline) {
      outline = prompt('请输入章节大纲：');
      if (!outline) return;
    }
    generateChapter(outline);
  });

  /* ---- SSE: Real-time Progress ---- */
  function connectSSE() {
    if (eventSource) {
      eventSource.close();
    }
    eventSource = new EventSource('/api/events');
    eventSource.onmessage = function(e) {
      try {
        var event = JSON.parse(e.data);
        if (event.agent_id && event.status) {
          updateProgressDot(event.agent_id, event.status);

          if (event.agent_id === 'agent1' && event.status === 'running') {
            showToast('正在清洗分章...');
          } else if (event.agent_id === 'agent2' && event.status === 'running') {
            showToast('正在拆解分析...');
          } else if (event.agent_id === 'agent3' && event.status === 'running') {
            showToast('正在构建知识库...');
          } else if (event.agent_id === 'agent4' && event.status === 'done') {
            showToast('章节生成完成!');
            btnAnalyze.disabled = false;
            btnAnalyze.textContent = '开始拆书';
            // Fetch state to get the chapter content
            fetchState();
          } else if (event.agent_id === 'agent3' && event.status === 'done') {
            btnAnalyze.disabled = false;
            btnAnalyze.textContent = '开始拆书';
            showToast('拆书分析完成!');
            fetchState();
          }
        }
        if (event.error) {
          showToast('错误: ' + event.error, 4000);
          btnAnalyze.disabled = false;
          btnAnalyze.textContent = '开始拆书';
          btnGenerateCh.disabled = false;
        }
      } catch (err) {
        // ignore parse errors
      }
    };
    eventSource.onerror = function() {
      // SSE will auto-reconnect
    };
  }

  /* ---- State Polling ---- */
  function fetchState() {
    fetch('/api/state')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        // Update KB stats
        if (data.knowledge_base) {
          kbCharCount.textContent = data.knowledge_base.character_count || 0;
          kbForeshadowCount.textContent = data.knowledge_base.foreshadowing_count || 0;
        }

        // Update progress dots from state
        if (data.current_step) {
          var steps = ['agent1', 'agent2', 'agent3', 'agent4'];
          var stepIdx = steps.indexOf(data.current_step);
          for (var i = 0; i < steps.length; i++) {
            var dot = $('#dot' + (i + 1));
            if (!dot) continue;
            dot.classList.remove('done', 'running', 'error');
            if (i < stepIdx) dot.classList.add('done');
            else if (i === stepIdx && data.current_step === steps[i]) dot.classList.add('running');
          }
        }

        // Show last chapter if available
        if (data.result && data.result.last_chapter) {
          addMessage('ai', data.result.last_chapter);
          // Clear it from state client-side so we don't show it again
          // (server may still hold it; we just track what we've seen)
        }

        if (data.result && data.result.chunks && !data._notified_analysis) {
          addMessage('ai', '拆书分析完成。共处理 ' + data.result.chunks.length + ' 个分章。\n角色数量: ' +
            (data.knowledge_base ? data.knowledge_base.character_count : 'N/A') +
            '\n\n现在可以输入章节大纲开始创作。');
          data._notified_analysis = true;
        }

        if (data.is_error && data.error) {
          showToast('错误: ' + data.error, 4000);
        }
      })
      .catch(function() {
        // silent
      });
  }

  // Track what we've already notified about
  var lastChapterNotified = '';

  function pollStateLoop() {
    fetch('/api/state')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        kbCharCount.textContent = data.knowledge_base ? data.knowledge_base.character_count || 0 : 0;
        kbForeshadowCount.textContent = data.knowledge_base ? data.knowledge_base.foreshadowing_count || 0 : 0;

        // Check for new chapter
        if (data.result && data.result.last_chapter && data.result.last_chapter !== lastChapterNotified) {
          lastChapterNotified = data.result.last_chapter;
          removeTypingIndicator();
          addMessage('ai', data.result.last_chapter);
          btnGenerateCh.disabled = false;
        }

        if (data.is_error && data.error) {
          removeTypingIndicator();
          btnAnalyze.disabled = false;
          btnAnalyze.textContent = '开始拆书';
          btnGenerateCh.disabled = false;
        }
      })
      .catch(function() {});
  }

  /* ---- Initialize ---- */
  function init() {
    connectSSE();
    setInterval(pollStateLoop, 2000);

    // Auto-hide empty state when messages exist
    // (handled in addMessage)

    // Close sidebar on mobile by default
    if (window.innerWidth <= 768) {
      closeSidebar();
    }
  }

  init();

})();
</script>
</body>
</html>
